name: Deploy Onboarding Tracker to GitHub Pages

# Publishes the static bundle in deploy/ to GitHub Pages.
# The app is fully static with relative paths, so it runs on Pages in its
# built-in demo mode (no backend required).

on:
  push:
    branches:
      - main
      - claude/vibez-deploy-nj2fcv
    paths:
      - 'deploy/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
